[project]
name = "nairobi-air-quality-batch-pipeline"
version = "0.1.0"
description = "Nairobi air quality pipeline"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Gacheri-Mutua", email = "gacherimutua@gmail.com" }
]
dependencies = [
    "apache-airflow>=3.3.1",
    "apache-airflow-providers-apache-cassandra>=3.9.5",
    "apache-airflow-providers-postgres>=7.0.2",
    "cassandra-driver>=3.30.1",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
